name: 設計師試用回饋
description: 哪些地方省時，哪些地方仍需要修改或重畫。
title: "[試用回饋] "
body:
  - type: markdown
    attributes:
      value: |
        不必公開客戶素材，也不必為回報再做兩遍。請只分享有權公開的內容；時間不確定可填未知。
  - type: input
    id: environment
    attributes:
      label: 工具版本與接手軟體
      placeholder: 例如 Preview 4、Windows 11、Illustrator 版本
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 哪些留下、修改、重畫？
      description: 說明圖的類型與最有代表性的區域即可。最省時或最費工的是哪一步？
      placeholder: 例如圖示外圈留下；文字重畫；找碎點比直接重畫還久。
    validations:
      required: true
  - type: textarea
    id: time
    attributes:
      label: 時間與補充證據（選填）
      description: 可填實際時間、粗估或未知。若本來就有原工作法的紀錄，可一併寫出；不要求雙重計時。可附有權公開的截圖或匿名合成例。
