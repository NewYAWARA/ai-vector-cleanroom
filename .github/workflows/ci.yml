name: Windows source preview checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      AVC_NO_BROWSER: "1"
      VECTOR_TEST_REUSE: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Configure external runtime and data paths
        run: |
          "AVC_DATA_DIR=$env:RUNNER_TEMP\avc-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AVC_VENV_DIR=$env:RUNNER_TEMP\avc-venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create isolated runtime and install the 18 exact dependencies
        run: |
          python -m venv "$env:AVC_VENV_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:AVC_VENV_DIR\Scripts\python.exe" -m pip install --only-binary=:all: -r requirements/validated-py312.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:AVC_VENV_DIR\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check runtime and native renderer
        run: python -B environment_preflight.py --full --strict-versions
      - name: Check repository publication contents
        run: python -B preflight_check.py
      - name: Audit source allowlist
        run: python -B release/package_source_beta6.py audit
      - name: Build and verify source-only archive
        run: |
          python -B release/package_source_beta6.py build --zip "$env:RUNNER_TEMP\AI-Vector-Cleanroom-Designer-Preview-4.zip" --receipt "$env:RUNNER_TEMP\SOURCE_RELEASE_RECEIPT_Designer_Preview_4.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B release/package_source_beta6.py verify --zip "$env:RUNNER_TEMP\AI-Vector-Cleanroom-Designer-Preview-4.zip" --receipt "$env:RUNNER_TEMP\SOURCE_RELEASE_RECEIPT_Designer_Preview_4.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\AI-Vector-Cleanroom-Designer-Preview-4.zip" -DestinationPath "$env:RUNNER_TEMP\avc-source"
      - name: Test the extracted public source, without private fixtures
        run: |
          Set-Location "$env:RUNNER_TEMP\avc-source\AI-Vector-Cleanroom-Designer-Preview-4"
          python -B preflight_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p 'test_*.py' -v
